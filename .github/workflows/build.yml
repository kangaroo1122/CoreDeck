name: Build & Test

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      matrix:
        include:
          - os: windows-latest
            build_type: Release
            artifact_name: coredeck-windows-x86-64
            target_arch: x86-64
          - os: windows-11-arm
            build_type: Release
            artifact_name: coredeck-windows-arm64
            target_arch: arm64
          - os: macos-latest
            build_type: Release
            artifact_name: coredeck-darwin-arm64
          - os: ubuntu-latest
            build_type: Release
            artifact_name: coredeck-linux-x86-64
          - os: ubuntu-24.04-arm
            build_type: Release
            artifact_name: coredeck-linux-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up CMake
        if: runner.os != 'Windows'
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.23.0'

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libcurl4-openssl-dev libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev

      - name: Configure CMake
        env:
          COREDECK_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          COREDECK_TARGET_ARCH: ${{ matrix.target_arch || '' }}
        run: |
          cmake_args=(
            -B build
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
            -DCOREDECK_BUILD_TESTS=ON
            -DCOREDECK_SENTRY_DSN="$COREDECK_SENTRY_DSN"
            -DCOREDECK_TARGET_ARCH="$COREDECK_TARGET_ARCH"
          )
          if [[ "$RUNNER_OS" == "Windows" && "$COREDECK_TARGET_ARCH" == "arm64" ]]; then
            cmake_args+=(-A ARM64)
          elif [[ "$RUNNER_OS" == "Windows" && "$COREDECK_TARGET_ARCH" == "x86-64" ]]; then
            cmake_args+=(-A x64)
          fi
          cmake "${cmake_args[@]}"
        shell: bash

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Run tests
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ matrix.build_type }}
          path: |
            build/CoreDeck*
            build/assets/
