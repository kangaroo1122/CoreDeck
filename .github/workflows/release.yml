name: Release (Windows, Linux, and Mac)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override for manual runs.'
        required: true
        default: 'v0.0.0-manual'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: coredeck-linux-x86-64
            asset_name: coredeck-linux-x86-64.tar.gz
          - os: ubuntu-24.04-arm
            artifact_name: coredeck-linux-arm64
            asset_name: coredeck-linux-arm64.tar.gz
          - os: windows-latest
            artifact_name: coredeck-windows-x86-64
            asset_name: coredeck-windows-x86-64
            target_arch: x86-64
          - os: windows-11-arm
            artifact_name: coredeck-windows-arm64
            asset_name: coredeck-windows-arm64
            target_arch: arm64
          - os: macos-latest
            artifact_name: coredeck-darwin-arm64
            asset_name: coredeck-darwin-arm64-unsigned.dmg

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up CMake
        if: runner.os != 'Windows'
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.23.0'

      - name: Setup ccache
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.artifact_name }}

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libcurl4-openssl-dev libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev

      - name: Configure CMake
        env:
          COREDECK_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          COREDECK_VERSION_REF: ${{ inputs.version || github.ref_name }}
          COREDECK_TARGET_ARCH: ${{ matrix.target_arch || '' }}
        run: |
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            export CMAKE_C_COMPILER_LAUNCHER=ccache
            export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          fi
          cmake_args=(
            -B build
            -DCMAKE_BUILD_TYPE=Release
            -DCOREDECK_SENTRY_DSN="$COREDECK_SENTRY_DSN"
            -DCOREDECK_VERSION_OVERRIDE="$COREDECK_VERSION_REF"
            -DCOREDECK_TARGET_ARCH="$COREDECK_TARGET_ARCH"
          )
          if [[ "$RUNNER_OS" == "Windows" && "$COREDECK_TARGET_ARCH" == "arm64" ]]; then
            cmake_args+=(-A ARM64)
          elif [[ "$RUNNER_OS" == "Windows" && "$COREDECK_TARGET_ARCH" == "x86-64" ]]; then
            cmake_args+=(-A x64)
          fi
          cmake "${cmake_args[@]}"
        shell: bash

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package artifacts (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          mkdir -p release/${{ matrix.artifact_name }}
          cp build/CoreDeck release/${{ matrix.artifact_name }}/
          cp -r build/assets release/${{ matrix.artifact_name }}/
          cd release
          tar -czf ${{ matrix.asset_name }} ${{ matrix.artifact_name }}

      - name: Package unsigned DMG (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          # Build an unsigned .dmg via CPack (DragNDrop).
          # hdiutil detach can fail transiently on GitHub runners when Spotlight,
          # Finder helpers, or a leftover mount from a previous attempt keep the
          # volume busy. Force-eject any stale /Volumes/CoreDeck mount first,
          # then retry the cpack invocation a couple of times if it fails.
          mkdir -p release
          cd build

          # Volume name comes from CPACK_DMG_VOLUME_NAME = ${PROJECT_NAME}.
          detach_stale_volume() {
            for mount in /Volumes/CoreDeck /Volumes/CoreDeck-*; do
              if [ -d "$mount" ]; then
                echo "Detaching stale mount: $mount"
                hdiutil detach "$mount" -force || true
              fi
            done
          }

          # Clean up before the first attempt, not just on retry, in case a
          # previous job on this runner left a stale /Volumes mount behind.
          detach_stale_volume

          attempts=0
          max_attempts=3
          until cpack -G DragNDrop; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge "$max_attempts" ]; then
              echo "::error::cpack -G DragNDrop failed after $attempts attempts"
              exit 1
            fi
            echo "::warning::cpack DragNDrop attempt $attempts failed; cleaning up and retrying in 5s"
            detach_stale_volume
            rm -f ./*.dmg
            sleep 5
          done
          cd ..
          # CPack produces a versioned filename (e.g. CoreDeck-1.2.3-Darwin.dmg);
          # grab whichever .dmg it created and rename to our stable asset name.
          DMG_BUILT=$(ls build/*.dmg | head -n 1)
          mv "$DMG_BUILT" "release/${{ matrix.asset_name }}"

      - name: Install WiX Toolset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset --yes --no-progress

          $roots = @(
            [Environment]::GetFolderPath('ProgramFilesX86'),
            [Environment]::GetFolderPath('ProgramFiles')
          ) | Where-Object { $_ }

          $wixRoot = Get-ChildItem -Path $roots -Directory -Filter 'WiX Toolset v*' -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName 'bin\candle.exe') } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $wixRoot) {
            throw 'WiX Toolset was installed, but candle.exe was not found.'
          }

          $wixBin = Join-Path $wixRoot.FullName 'bin'
          $env:PATH = "$wixBin;$env:PATH"
          Add-Content -Path $env:GITHUB_ENV -Value "WIX=$($wixRoot.FullName)"
          Add-Content -Path $env:GITHUB_PATH -Value $wixBin

          where.exe candle
          where.exe light

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cd build
          cpack -G ZIP
          cpack -G WIX
          mkdir ..\release
          for %%i in (*.msi) do copy "%%i" "..\release\${{ matrix.asset_name }}.msi"
          for %%i in (*.zip) do copy "%%i" "..\release\${{ matrix.asset_name }}.zip"

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/${{ matrix.asset_name }}.msi
            release/${{ matrix.asset_name }}.zip

      - name: Upload artifacts (Linux and macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/${{ matrix.asset_name }}

  create-release:
    name: Create GitHub Release
    needs: build-and-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve release version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog for this tag
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\["ver"\\]" { found=1; next }
            found && /^## \[/      { exit }
            found                  { print }
          ' CHANGELOG.md)
          # Trim leading/trailing blank lines.
          NOTES=$(printf '%s\n' "$NOTES" | sed -e '/./,$!d' | tac | sed -e '/./,$!d' | tac)
          if [ -z "$NOTES" ]; then
            NOTES="_See [CHANGELOG.md](https://github.com/kangaroo1122/CoreDeck/blob/main/CHANGELOG.md) for details._"
          fi
          {
            echo "notes<<__EOF__"
            echo "$NOTES"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            sha256sum "$f" > "${f}.sha256"
          done < <(find . -type f \( -name '*.tar.gz' -o -name '*.msi' -o -name '*.zip' -o -name '*.dmg' \))

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: CoreDeck ${{ steps.version.outputs.version }}
          body: |
            ### CoreDeck ${{ steps.version.outputs.version }}

            A new CoreDeck release is available. Here's what's changed in this version.

            ### What's New
            ${{ steps.changelog.outputs.notes }}

            ---

            Download the appropriate version for your platform:

            **Windows (x86-64):**
            - `coredeck-windows-x86-64.msi` - Professional installer (recommended)
            - `coredeck-windows-x86-64.zip` - Portable version

            **Windows (ARM64):**
            - `coredeck-windows-arm64.msi` - Professional installer (recommended)
            - `coredeck-windows-arm64.zip` - Portable version

            **macOS (Apple Silicon):** `coredeck-darwin-arm64-unsigned.dmg`

            **Linux (x86-64):** `coredeck-linux-x86-64.tar.gz`

            **Linux (ARM64):** `coredeck-linux-arm64.tar.gz`

            Each artifact has an accompanying `.sha256` file for download verification.

            ### Installation
            **Windows:** Double-click the MSI to install, or extract the ZIP and run CoreDeck.exe directly.

            **macOS:** Open the DMG and drag `CoreDeck.app` into your Applications folder.

            **Linux:** Extract the archive and run the `CoreDeck` executable.

            ### Troubleshooting (macOS)
            This DMG is currently unsigned. If the app won't open after copying it out of the DMG, remove the quarantine attribute:
            ```bash
            xattr -cr /Applications/CoreDeck.app
            ```
          files: |
            artifacts/**/coredeck-*.msi
            artifacts/**/coredeck-*.zip
            artifacts/**/coredeck-*.tar.gz
            artifacts/**/coredeck-*.dmg
            artifacts/**/*.sha256
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
